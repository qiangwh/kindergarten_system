# ====================================================
# 生产环境配置
# ====================================================

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:4000}/${DB_NAME:kindergarten_db}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000
      initialization-fail-timeout: -1
      connection-test-query: SELECT 1
      validation-timeout: 5000

logging:
  level:
    com.kindergarten: INFO
    root: WARN

r2:
  endpoint: ${R2_ENDPOINT:}
  access-key: ${R2_ACCESS_KEY:}
  secret-key: ${R2_SECRET_KEY:}
  bucket: ${R2_BUCKET:}
  public-url: ${R2_PUBLIC_URL:}
  region: ${R2_REGION:auto}
  max-file-size-mb: ${R2_MAX_FILE_SIZE_MB:10}
