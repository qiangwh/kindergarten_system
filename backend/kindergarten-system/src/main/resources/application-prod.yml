spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:4000}/${DB_NAME:kindergarten_db}?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

logging:
  level:
    com.kindergarten: INFO
    root: WARN

r2:
  endpoint: ${R2_ENDPOINT}
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}
  bucket: ${R2_BUCKET}
  public-url: ${R2_PUBLIC_URL}
  region: ${R2_REGION:auto}
  max-file-size-mb: ${R2_MAX_FILE_SIZE_MB:10}
