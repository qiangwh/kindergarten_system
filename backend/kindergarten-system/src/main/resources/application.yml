spring:
  profiles:
    active: dev
  application:
    name: kindergarten-system

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  # 至少 32 字节，生产环境请使用环境变量覆盖
  secret: kindergarten-system-secret-key-2024-very-long-secret
  expiration: 86400000
  issuer: kindergarten-system
