spring:
  profiles:
    active: dev,local
  application:
    name: kindergarten-system

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  # 密钥通过 application-local.yml 或环境变量提供
  secret: ${JWT_SECRET:please-set-jwt-secret-in-local-yml}
  # 2小时过期（7200000毫秒）
  expiration: ${JWT_EXPIRATION:7200000}
  issuer: kindergarten-system
