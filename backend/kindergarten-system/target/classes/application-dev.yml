spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:4000}/${DB_NAME:kindergarten_db}?sslMode=PREFERRED&serverTimezone=Asia/Shanghai&characterEncoding=utf8&enabledTLSProtocols=TLSv1.2,TLSv1.3&connectTimeout=30000&socketTimeout=60000
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.kindergarten: DEBUG
    org.springframework.security: DEBUG

r2:
  endpoint: ${R2_ENDPOINT}
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}
  bucket: ${R2_BUCKET}
  public-url: ${R2_PUBLIC_URL}
  region: ${R2_REGION:auto}
  max-file-size-mb: ${R2_MAX_FILE_SIZE_MB:10}
